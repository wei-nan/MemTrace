name: Release Loop (G4 Spec-Sync)

# DRAFT — not yet enabled. Do not switch the trigger to `pull_request` until
# at least one manual workflow_dispatch run has been reviewed end-to-end (see
# checklist below and ws_6aa957c3/mem_cc085a90). The agent logic itself now
# has a real implementation (scripts/release_loop_agent.py), but it has never
# been run against a live Gemini/MemTrace endpoint from this environment —
# treat the first run as a test, not a production gate.
#
# Purpose: closes the gap that spec-sync.yml does not cover. spec-sync.yml
# only checks that the seed JSON, generated SQL, and live public KB agree
# with *each other* — it never fires when a router file changes public
# behavior without touching the seed at all. This workflow watches the
# behavior-side paths and runs an agent to draft/review the corresponding
# zh/en spec content, then re-runs the deterministic check as a final
# guard. It is a pre-merge hard gate (G4): unlike the Agent Loop's regular
# CI regression check, there is no "let it through, fix later" option —
# see the "Blocking semantics" section in mem_cc085a90.
#
# Provider (2026-07-30): Gemini, not Claude/Anthropic — this project already
# ships a GeminiProvider (packages/api/core/ai.py) calling
# generativelanguage.googleapis.com directly, and GEMINI_API_KEY is already
# an established secret name in .env.example. Model id is not hardcoded as
# "correct" — release_loop_agent.py verifies GEMINI_MODEL against the live
# /v1beta/models list before use and fails loudly on a mismatch, per this
# project's "no hardcoded model id" convention (ws_spec_plan/mem_6ee3ee82).
#
# Required repo secrets (configured 2026-07-30):
#   - GEMINI_API_KEY
#   - MEMTRACE_API_KEY
# Required repo variable (NOT a secret — it's a hostname, not sensitive;
# still unset as of this commit, needs to be added under Settings > Secrets
# and variables > Actions > Variables before the first run):
#   - MEMTRACE_BASE_URL (e.g. https://api.memtrace.example.com)
#
# Commit-back assumption (2026-07-30, accepted, not re-litigated here): PRs
# in this repo are same-repo feature branches, not external forks, so the
# default GITHUB_TOKEN's push permission is sufficient. Forked-PR handling
# (comment-only fallback, since GITHUB_TOKEN can't push to a fork) is
# deliberately not built — add it if/when an actual forked PR shows up.
#
# Rerun policy on repeated pushes: not yet decided — this workflow currently
# reruns in full on every workflow_dispatch invocation. No debouncing.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the release loop against'
        required: true
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'examples/spec-as-kb/**'
  #     - 'packages/api/core/constants.py'
  #     - 'packages/api/migrations/**'
  #     - 'packages/api/services/mcp_tools.py'
  #     - 'packages/api/routers/kb.py'
  #     - 'packages/api/routers/mcp.py'
  #     - 'packages/api/routers/auth.py'
  #     - 'packages/api/routers/registration.py'
  #     - 'packages/api/routers/api_keys.py'
  #     - 'packages/api/routers/openai_compat.py'
  #     - 'packages/api/routers/exports.py'

permissions:
  contents: write       # commit-back to the PR branch (same-repo only, see above)
  pull-requests: write  # comment on REJECT

jobs:
  release-loop:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MEMTRACE_API_KEY: ${{ secrets.MEMTRACE_API_KEY }}
      MEMTRACE_BASE_URL: ${{ vars.MEMTRACE_BASE_URL }}
      GEMINI_MODEL: gemini-3.6-flash
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve PR ref
        id: pr
        run: |
          gh pr view "${{ github.event.inputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --json headRefName,baseRefName,isCrossRepository \
            > pr.json
          echo "head_ref=$(jq -r .headRefName pr.json)" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r .baseRefName pr.json)" >> "$GITHUB_OUTPUT"
          cross_repo=$(jq -r .isCrossRepository pr.json)
          if [ "$cross_repo" = "true" ]; then
            echo "::error::PR #${{ github.event.inputs.pr_number }} is from a fork. Commit-back via GITHUB_TOKEN will not work (see commit-back assumption in the header comment). Aborting rather than silently failing partway through."
            exit 1
          fi

      - uses: actions/checkout@v3
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Release Loop agent
        id: agent
        env:
          RELEASE_LOOP_BASE_REF: origin/${{ steps.pr.outputs.base_ref }}
        run: |
          python3 scripts/release_loop_agent.py

      - name: Commit drafted spec content back to the PR branch
        if: always() && steps.agent.outcome != 'skipped'
        run: |
          if ! git diff --quiet -- examples/spec-as-kb/ packages/api/migrations/003_seed_spec_kb.sql; then
            git config user.name "release-loop-agent"
            git config user.email "release-loop-agent@users.noreply.github.com"
            git add examples/spec-as-kb/ packages/api/migrations/003_seed_spec_kb.sql
            git commit -m "chore(release-loop): draft spec content for public behavior change" \
                        -m "Automated by release_loop_agent.py (G4). Verdict evidence written to ws_spec_plan. Review before this PR merges — this is drafted content, not a human-authored spec update."
            git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"
          else
            echo "no spec content changes to commit back"
          fi

      - name: Comment on PR if REJECT
        if: failure() && steps.agent.outcome == 'failure'
        run: |
          gh pr comment "${{ github.event.inputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --body "**Release Loop (G4) REJECT** — see the Actions run log for the full gate_verdict (missing/reasons). This blocks merge; the verdict has also been written to \`ws_spec_plan\` for reference. No retroactive fix-up path for G4 — resolve on this branch and rerun."
