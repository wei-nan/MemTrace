name: Spec Sync Check

# Blocking drift gate for the spec-as-kb seed. Regenerates the seed SQL from the
# JSON source of truth and compares it to the committed copies, and checks zh/en
# node parity. Fails the PR if the committed SQL drifts from the seed JSON or an
# en node has no zh source. To refresh after editing seed JSON, run:
#   python scripts/seed_spec_kb.py --write
# (zh-without-en is reported as a warning and does not fail the job.)
#
# Also runs the doc<->code drift checker (scripts/check_doc_drift.py), which
# guards the two lines this job's seed-sync check doesn't cover: docs/SPEC.md
# and packages/api/docs/mcp-contract.md against their live code counterparts
# (constants.py, mcp_tools.py). Uses a baseline ratchet (scripts/doc_drift_
# baseline.json) for existing debt — see ws_spec_plan/mem_388cc8e4. Shares this
# workflow rather than a separate one to avoid multiplying CI jobs for what is
# still a small number of checks; split out if the checks grow.

on:
  pull_request:
    paths:
      - 'examples/spec-as-kb/**'
      - 'scripts/seed_spec_kb.py'
      - 'packages/api/migrations/003_seed_spec_kb.sql'
      - 'docs/SPEC.md'
      - 'packages/api/core/constants.py'
      - 'packages/api/docs/mcp-contract.md'
      - 'packages/api/services/mcp_tools.py'
      - 'scripts/check_doc_drift.py'
      - 'scripts/doc_drift_baseline.json'

jobs:
  spec-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Spec-sync drift check
        run: python scripts/seed_spec_kb.py --check
      - name: Doc-drift check (SPEC.md / mcp-contract.md vs live code)
        run: python scripts/check_doc_drift.py --check
