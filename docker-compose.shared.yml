# Advanced usage: run the API against an externally managed PostgreSQL
# container (e.g. one Postgres instance shared by several apps on the same
# host) instead of the self-contained `db` service in docker-compose.yml.
#
# This is NOT the default setup — most installs should just use
# docker-compose.yml as-is (see docs/DEVELOPMENT.md / docs/DEPLOYMENT.md).
# Only reach for this if you already run Postgres for other projects and
# want MemTrace to share it rather than run its own instance.
#
# Setup:
#   1. cp docker-compose.shared.yml.example docker-compose.shared.yml
#      (docker-compose.shared.yml is gitignored — it's a local file, not
#      something to commit; adjust the network/host names to match your
#      actual shared Postgres setup)
#   2. Make sure the external network already exists and your shared
#      Postgres container is attached to it:
#        docker network create shared-db   # if it doesn't exist yet
#   3. This file is standalone — it is NOT merged with docker-compose.yml.
#      Run it on its own:
#        docker compose -f docker-compose.shared.yml up -d --build
#
# Note: scripts/backup.sh and scripts/restore.sh assume a container named
# `memtrace-db`. Against an external shared Postgres container (a different
# name), back it up/restore it using that project's own tooling instead.

services:
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: memtrace-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Adjust `shared-postgres` to your external Postgres container's name.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shared-postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      MEMTRACE_ANON_LOG_SALT: ${MEMTRACE_ANON_LOG_SALT:-dev_salt_123}
      REGISTRATION_MODE: ${MEMTRACE_REGISTRATION_MODE:-invite_only}
    ports:
      - "0.0.0.0:8001:8000"
    depends_on:
      - shared-postgres-check
    volumes:
      - ./packages/api/data:/app/data
      - ./packages/api/tests:/app/tests
      - ./backups:/backups
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-db
      - default

  shared-postgres-check:
    image: postgres:17-alpine
    container_name: memtrace-db-check
    restart: "no"
    entrypoint: >
      sh -c "until pg_isready -h shared-postgres -U ${POSTGRES_USER:-postgres}; do sleep 2; done"
    networks:
      - shared-db

  ui:
    build:
      context: .
      dockerfile: packages/ui/Dockerfile
    container_name: memtrace-ui
    restart: unless-stopped
    ports:
      - "0.0.0.0:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=0755,uid=1000,gid=1000
      - /var/run:mode=0755,uid=1000,gid=1000

networks:
  shared-db:
    external: true
    name: shared-db
